name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      APP_ENV: test
      API_ACCESS_TOKEN: ci-test-token
      GEMINI_API_KEY: ""
      ALLOWED_CORS_ORIGINS: https://dashboard.example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing
      - name: Compile Python sources
        run: python -m compileall -q backend tests tools
      - name: Lint Python
        run: python -m ruff check backend tests tools
      - name: Check formatting for maintained Python code
        run: python -m ruff format --check backend/app tests tools
      - name: Type check application core
        run: python -m mypy backend/app
      - name: Validate extension JavaScript
        shell: bash
        run: for file in frontend/*.js; do node --check "$file"; done
      - name: Validate extension manifest
        run: python -c "import json; json.load(open('frontend/manifest.json', encoding='utf-8'))"
      - name: Run repository security checks
        run: python tools/security_checks.py
      - name: Validate deployment script syntax
        shell: bash
        run: bash -n scripts/deploy.sh

  container-validation:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      API_ACCESS_TOKEN: ci-test-token
      GEMINI_API_KEY: ""
      ALLOWED_CORS_ORIGINS: https://dashboard.example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare safe Compose environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e APP_DOMAIN=app.example.com
          -e API_DOMAIN=api.example.com
          -e ACME_EMAIL=ops@example.com
          -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate local HTTPS Caddy configuration
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/Caddyfile.integration:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build API image
        run: docker build --file Dockerfile.api --tag seo-sensei-api:ci .
      - name: Build dashboard image
        run: docker build --file Dockerfile.dashboard --tag seo-sensei-dashboard:ci .
      - name: Build static web and Caddy image
        run: docker build --file Dockerfile.web --tag seo-sensei-web:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and fixture checks
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility checks
        run: npm run test:e2e

  authenticated-integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: seo-sensei-phase2d-ci
      PHASE2D_TEST_USERNAME: phase2d-reviewer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable extension identity and API token
        shell: bash
        run: |
          set -eu
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf 'PHASE2E_TEST_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          runtime_dir="$RUNNER_TEMP/seo-sensei-extension-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata="$(node tests/integration/prepare_extension_runtime.mjs "$GITHUB_WORKSPACE/frontend" "$runtime_dir")"
          printf 'PHASE2E_EXTENSION_ID=%s\n' "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).extensionId)' "$metadata")" >> "$GITHUB_ENV"
          printf 'PHASE2E_EXTENSION_DIR=%s\n' "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).extensionDirectory)' "$metadata")" >> "$GITHUB_ENV"
          printf 'PHASE2E_COMPOSE_OVERRIDE=%s\n' "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).composeOverride)' "$metadata")" >> "$GITHUB_ENV"
      - name: Create disposable integration password
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'PHASE2D_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - name: Validate isolated Compose configuration
        run: docker compose -f compose.integration.yaml -f "$PHASE2E_COMPOSE_OVERRIDE" config --quiet
      - name: Start loopback HTTPS integration stack
        run: docker compose -f compose.integration.yaml -f "$PHASE2E_COMPOSE_OVERRIDE" up --build --detach --wait --wait-timeout 180
      - name: Install temporary Caddy root certificate
        run: |
          docker compose -f compose.integration.yaml -f "$PHASE2E_COMPOSE_OVERRIDE" cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/seo-sensei-phase2d-root.crt
          sudo install -m 0644 /tmp/seo-sensei-phase2d-root.crt /usr/local/share/ca-certificates/seo-sensei-phase2d.crt
          sudo update-ca-certificates
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          if [[ ! -f "$HOME/.pki/nssdb/cert9.db" ]]; then
            certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n "SEO Sensei Phase 2D Caddy Root" -t "C,," -i /tmp/seo-sensei-phase2d-root.crt
          certutil -L -d "sql:$HOME/.pki/nssdb" | grep -F "SEO Sensei Phase 2D Caddy Root"
          echo "NODE_EXTRA_CA_CERTS=/tmp/seo-sensei-phase2d-root.crt" >> "$GITHUB_ENV"
      - name: Verify extension CORS and protected legacy route
        run: |
          api_host=seo-sensei-api.localhost
          extension_origin="chrome-extension://${PHASE2E_EXTENSION_ID}"
          preflight_headers=$(mktemp)
          preflight_status=$(curl --silent --show-error --resolve "$api_host:8443:127.0.0.1" --cacert /tmp/seo-sensei-phase2d-root.crt \
            --output /dev/null --dump-header "$preflight_headers" --write-out '%{http_code}' --request OPTIONS \
            --header "Origin: $extension_origin" --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type' "https://$api_host:8443/analyse-url")
          test "$preflight_status" = 200
          grep -F "access-control-allow-origin: $extension_origin" "$preflight_headers" -i
          rejected_origin=chrome-extension://bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          rejected_headers=$(mktemp)
          rejected_status=$(curl --silent --show-error --resolve "$api_host:8443:127.0.0.1" --cacert /tmp/seo-sensei-phase2d-root.crt \
            --output /dev/null --dump-header "$rejected_headers" --write-out '%{http_code}' --request OPTIONS \
            --header "Origin: $rejected_origin" --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type' "https://$api_host:8443/analyse-url")
          test "$rejected_status" = 400
          if grep -qi '^access-control-allow-origin:' "$rejected_headers"; then
            echo 'An unrelated extension origin unexpectedly received a CORS grant.'
            exit 1
          fi
          app_host=seo-sensei.localhost
          origin_body=$(mktemp)
          origin_status=$(curl --silent --show-error --resolve "$app_host:8443:127.0.0.1" --cacert /tmp/seo-sensei-phase2d-root.crt \
            --output "$origin_body" --write-out '%{http_code}' --request POST --header 'Origin: https://attacker.example' \
            --header 'Content-Type: application/json' --data '{"url":"https://phase2d.test/pages/noindex"}' "https://$app_host:8443/api/browser/v1/analyse-url")
          test "$origin_status" = 403
          grep -F '"code":"origin_rejected"' "$origin_body"
          legacy_status=$(curl --silent --show-error --resolve "$api_host:8443:127.0.0.1" --cacert /tmp/seo-sensei-phase2d-root.crt \
            --output /dev/null --write-out '%{http_code}' --request POST --header "Origin: $extension_origin" \
            --header 'Content-Type: application/json' --data '{}' "https://$api_host:8443/analyse-url")
          test "$legacy_status" = 401
          api_id=$(docker compose -f compose.integration.yaml -f "$PHASE2E_COMPOSE_OVERRIDE" ps -q api)
          published_ports=$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$api_id")
          if [[ "$published_ports" == *'"HostPort"'* ]]; then
            echo 'The integration API unexpectedly has a published host port.'
            exit 1
          fi
      - name: Run authenticated browser-to-API HTTPS tests
        working-directory: web
        run: npm run test:e2e:integration
      - name: Install isolated Chromium toolbar input tools
        run: sudo apt-get update && sudo apt-get install --yes xdotool xvfb
      - name: Run installed Chromium extension runtime verification
        working-directory: web
        env:
          PHASE2E_API_ORIGIN: https://seo-sensei-api.localhost:8443
          PHASE2E_EVIDENCE_DIR: review/evidence/phase-2e-c
        run: xvfb-run -a -s "-screen 0 1440x1000x24" npx playwright test --config playwright.extension-runtime.config.ts
      - name: Upload authenticated integration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2d-authenticated-integration-evidence
          path: web/review/evidence/phase-2d/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload installed extension runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2e-installed-extension-evidence
          path: web/review/evidence/phase-2e-c/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated stack and remove temporary CA trust
        if: always()
        run: |
          docker compose -f compose.integration.yaml -f "$PHASE2E_COMPOSE_OVERRIDE" down --volumes --remove-orphans
          sudo rm -f /usr/local/share/ca-certificates/seo-sensei-phase2d.crt /tmp/seo-sensei-phase2d-root.crt
          sudo update-ca-certificates
